<!doctype html><html lang="en"><head><link rel="icon" href="favicon.ico" sizes="any"><link rel="icon" type="image/png" sizes="32x32" href="images/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="images/favicon-16.png"><link rel="apple-touch-icon" sizes="180x180" href="images/apple-touch-icon.png"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Payment Cancelled | PLEASE Services</title><link rel="stylesheet" href="css/style.css?v=15.9.3"></head><body class="invoice-public-page"><main><div id="cancel-result" class="invoice-public-card payment-result-card"><p>Loading invoice…</p></div></main><script>
(async()=>{const box=document.getElementById('cancel-result'),token=new URLSearchParams(location.search).get('token')||'';const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const money=(n,c='CAD')=>new Intl.NumberFormat('en-CA',{style:'currency',currency:String(c||'CAD').toUpperCase()}).format(Number(n)||0);try{const r=await fetch('/.netlify/functions/public-invoice?token='+encodeURIComponent(token),{cache:'no-store'}),p=await r.json();if(!r.ok)throw Error(p.error||'Invoice unavailable');const i=p.invoice,cur=i.currency||'CAD';if(i.is_paid||i.payment_status==='PAID'){location.replace('payment-success.html?token='+encodeURIComponent(i.public_token));return}box.innerHTML=`<div class="payment-cancel-icon">!</div><h1>Payment cancelled</h1><p>Your invoice is still outstanding. No card payment was completed.</p><div class="payment-result-details"><span>Invoice</span><strong>${esc(i.invoice_number)}</strong><span>Amount due</span><strong>${money(i.balance,cur)}</strong><span>Status</span><strong>${esc(i.payment_status||'UNPAID')}</strong></div><div class="invoice-actions-row center"><a class="btn primary" href="invoice.html?token=${encodeURIComponent(i.public_token)}&payment=cancelled">Pay again</a><a class="btn secondary" href="index.html">Back to PLEASE</a></div>`}catch(e){box.innerHTML=`<div class="invoice-result-banner danger"><strong>Invoice unavailable</strong><span>${esc(e.message)}</span></div><p>Please contact PLEASE Services if you believe this invoice should be available.</p><a class="btn secondary" href="index.html">Back to PLEASE</a>`}})();
</script></body></html>

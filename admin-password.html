<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow,noarchive">
  <title>Change Admin Password — PLEASE</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Poppins:wght@600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="admin-auth-page">
  <main class="admin-auth-shell"><section class="admin-auth-card" aria-labelledby="password-title">
    <a class="admin-auth-brand" href="admin.html"><img src="images/please-logo.png" alt="PLEASE Services"></a>
    <p class="eyebrow dark">SECURE ADMINISTRATION</p><h1 id="password-title">Change password</h1>
    <p class="admin-auth-lead">Update the password stored for your PLEASE portal administrator account.</p>
    <div id="password-alert" class="form-alert" hidden></div>
    <form id="admin-password-form" class="admin-login-form">
      <label>Current Password<input id="current-password" type="password" autocomplete="current-password" required></label>
      <label>New Password<input id="new-password" type="password" autocomplete="new-password" minlength="10" required></label>
      <label>Confirm New Password<input id="confirm-password" type="password" autocomplete="new-password" minlength="10" required></label>
      <button id="password-submit" class="btn primary full" type="submit">CHANGE PASSWORD →</button>
    </form>
    <a class="admin-text-button" href="admin.html">← Back to Administration</a>
  </section></main>
  <script src="js/admin-password.js"></script>
</body></html>

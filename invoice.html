<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Invoice | PLEASE Services</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Poppins:wght@600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="css/style.css"></head><body class="invoice-public-page"><main><div id="invoice-public" class="invoice-public-card"><p>Loading invoice…</p></div></main><script>
(async()=>{const box=document.getElementById('invoice-public'),token=new URLSearchParams(location.search).get('token')||'',esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),money=n=>new Intl.NumberFormat('en-CA',{style:'currency',currency:'CAD'}).format(Number(n)||0);try{const r=await fetch('/.netlify/functions/public-invoice?token='+encodeURIComponent(token));const p=await r.json();if(!r.ok)throw Error(p.error||'Invoice unavailable');const i=p.invoice,balance=Math.max(0,Number(i.total_amount)-Number(i.amount_paid||0));box.innerHTML=`<div class="invoice-public-head"><img src="images/please-logo.png" alt="PLEASE Services"><div class="invoice-public-meta"><h1>${esc(i.invoice_number)}</h1><p>Invoice date: ${esc(i.invoice_date)}<br>${i.due_date?`Due date: ${esc(i.due_date)}<br>`:''}</p>${i.payment_status==='PAID'?'<span class="invoice-paid-badge">PAID</span>':'<span class="invoice-unpaid-badge">PAYMENT DUE</span>'}</div></div><hr><h3>Bill To</h3><p>${esc(i.client_name||'Customer')}</p><table class="invoice-public-table"><thead><tr><th>Description</th><th>Qty</th><th>Rate</th><th>Amount</th></tr></thead><tbody>${p.items.map(x=>`<tr><td>${esc(x.description)}</td><td>${Number(x.qty)}</td><td>${money(x.unit_rate)}</td><td>${money(x.line_total)}</td></tr>`).join('')}</tbody></table><div class="invoice-totals"><div class="invoice-total-line"><span>Subtotal</span><strong>${money(i.subtotal)}</strong></div><div class="invoice-total-line"><span>GST (${Number(i.gst_rate)}%)</span><strong>${money(i.gst_amount)}</strong></div><div class="invoice-total-line grand"><span>Total</span><strong>${money(i.total_amount)}</strong></div>${Number(i.amount_paid)>0?`<div class="invoice-total-line"><span>Paid</span><strong>${money(i.amount_paid)}</strong></div><div class="invoice-total-line grand"><span>Balance</span><strong>${money(balance)}</strong></div>`:''}</div>${i.note?`<p><strong>Note:</strong> ${esc(i.note)}</p>`:''}<div class="invoice-payment-panel">${i.payment_status==='PAID'?'<h3>Thank you. This invoice has been paid.</h3>':p.stripe_enabled?`<h3>Pay securely online</h3><p>Card payment is processed on Stripe-hosted checkout.</p><button id="pay-now" class="btn primary" type="button">PAY ${money(balance)} →</button><div id="pay-error" class="form-alert" hidden></div>`:'<h3>Payment</h3><p>Online card payment is not activated yet. Please contact PLEASE Services for payment instructions.</p><a class="btn primary" href="mailto:info@pleaseservice.ca?subject=Payment%20for%20'+encodeURIComponent(i.invoice_number)+'">CONTACT PLEASE</a>'}</div><p style="margin-top:24px">PLEASE Services · Calgary, Alberta · info@pleaseservice.ca · 587-836-2866</p>`;const b=document.getElementById('pay-now');if(b)b.onclick=async()=>{b.disabled=true;b.textContent='Opening secure checkout…';try{const rr=await fetch('/.netlify/functions/invoice-checkout',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({token})}),pp=await rr.json();if(!rr.ok)throw Error(pp.error||'Unable to start payment');location.href=pp.url}catch(e){const a=document.getElementById('pay-error');a.textContent=e.message;a.hidden=false;b.disabled=false;b.textContent='PAY '+money(balance)+' →'}}}catch(e){box.innerHTML='<h1>Invoice unavailable</h1><p>'+esc(e.message)+'</p><a class="btn secondary" href="index.html">Back to PLEASE Services</a>'}})();
</script></body></html>

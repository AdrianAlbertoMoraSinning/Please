<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PLEASE Professional</title><link rel="stylesheet" href="css/style.css"></head><body><main id="professional-profile" class="professional-profile-page"><div class="professional-loading">Loading professional profile…</div></main><script>const esc=v=>String(v??'').replace(/[&<>\"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[c]));(async()=>{const root=document.getElementById('professional-profile'),slug=new URLSearchParams(location.search).get('provider')||'';try{const r=await fetch('/.netlify/functions/public-provider?slug='+encodeURIComponent(slug));const d=await r.json();if(!r.ok)throw new Error(d.error||'Professional not found');const p=d.provider;root.innerHTML=`<section class="professional-hero"><a href="index.html"><img src="images/please-logo.png" alt="PLEASE"></a><p class="eyebrow">PLEASE PROFESSIONAL NETWORK</p><h1>${esc(p.display_name)}</h1><h2>${esc(p.public_title||'Service Professional')}</h2><p>${esc(p.short_bio||'Experienced professional coordinated through PLEASE Services.')}</p><div class="professional-badges">${p.licensed_certified?'<span>Licensed / Certified</span>':''}${p.insured?'<span>Insured</span>':''}<span>${esc(p.service_area||'Calgary & Surrounding Areas')}</span></div><a class="btn primary" href="index.html#quote">GET A FREE QUOTE →</a></section><section class="professional-services"><h2>Services through PLEASE</h2><div>${(p.services||[]).map(s=>`<article><h3>${esc(s.name)}</h3><p>${esc(s.short_description||'')}</p></article>`).join('')}</div><p class="professional-contact-note">All customer communication, quoting and scheduling is coordinated through PLEASE. Provider direct contact information is not published.</p></section>`;}catch(e){root.innerHTML=`<div class="professional-not-found"><h1>Professional profile unavailable</h1><p>${esc(e.message)}</p><a class="btn primary" href="index.html">RETURN TO PLEASE</a></div>`;}})();</script></body></html>

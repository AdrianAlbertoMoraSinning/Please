[functions]
  directory = "netlify/functions"

# STEP 17 — Native Accounting Engine worker.
# Financial events are already durable in Supabase before this worker runs.
[functions."cal-accounting-worker"]
  schedule = "* * * * *"

# STEP 13.2 — browser security baseline. CSP remains compatible with the
# current Supabase browser library, Google Fonts and existing static assets.
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), usb=()"
    Strict-Transport-Security = "max-age=31536000"
    Content-Security-Policy = "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; script-src 'self' https://cdn.jsdelivr.net https://js.stripe.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob: https://images.unsplash.com https://*.supabase.co; connect-src 'self' https://*.supabase.co https://api.stripe.com; frame-src https://js.stripe.com https://hooks.stripe.com; form-action 'self'; upgrade-insecure-requests"

# Friendly public routes prepared for the PLEASE domain.
[[redirects]]
  from = "/book"
  to = "/service-request.html"
  status = 200

[[redirects]]
  from = "/gallery"
  to = "/gallery-experience.html"
  status = 200

[[redirects]]
  from = "/track"
  to = "/track-request.html"
  status = 200

# STEP 16.0 — CAL Accounting portal routes
[[redirects]]
  from = "/cal"
  to = "/cal/dashboard.html"
  status = 200

[[redirects]]
  from = "/accounting"
  to = "/cal/dashboard.html"
  status = 200


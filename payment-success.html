<!doctype html><html lang="en"><head><link rel="icon" href="favicon.ico" sizes="any"><link rel="icon" type="image/png" sizes="32x32" href="images/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="images/favicon-16.png"><link rel="apple-touch-icon" sizes="180x180" href="images/apple-touch-icon.png"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Payment Confirmation | PLEASE Services</title><link rel="stylesheet" href="css/style.css?v=15.9.3"></head><body class="invoice-public-page"><main><div id="payment-result" class="invoice-public-card payment-result-card"><p>Confirming your payment with Stripe…</p></div></main><script>
(()=>{const box=document.getElementById('payment-result'),params=new URLSearchParams(location.search),token=params.get('token')||'',sessionId=params.get('session_id')||'';const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const money=(n,c='CAD')=>new Intl.NumberFormat('en-CA',{style:'currency',currency:String(c||'CAD').toUpperCase()}).format(Number(n)||0);const date=v=>{if(!v)return '';try{return new Intl.DateTimeFormat('en-CA',{dateStyle:'medium',timeStyle:'short'}).format(new Date(v))}catch{return String(v)}};function query(){const q=new URLSearchParams();if(token)q.set('token',token);if(sessionId)q.set('session_id',sessionId);return q.toString()}async function get(){const r=await fetch('/.netlify/functions/public-payment-result?'+query(),{cache:'no-store'}),p=await r.json();if(!r.ok)throw Error(p.error||'Payment confirmation is not available yet.');return p}function renderPaid(p){const i=p.invoice,cur=i.currency||'CAD',tx=p.latest_transaction||{};box.innerHTML=`<div class="payment-success-icon">✓</div><h1>Payment successful</h1><p>Thank you. Your payment has been received by PLEASE Services.</p><div class="payment-result-details"><span>Invoice</span><strong>${esc(i.invoice_number)}</strong><span>Amount paid</span><strong>${money(i.amount_paid||i.total_amount,cur)}</strong><span>Status</span><strong>PAID</strong>${i.paid_at?`<span>Paid on</span><strong>${esc(date(i.paid_at))}</strong>`:''}${(i.payment_reference||tx.external_reference)?`<span>Stripe confirmation</span><strong>${esc(i.payment_reference||tx.external_reference)}</strong>`:''}</div><div class="invoice-actions-row center"><a class="btn primary" href="invoice.html?token=${encodeURIComponent(i.public_token)}">View paid invoice</a><a class="btn secondary" href="index.html">Back to PLEASE</a></div>`}function renderPending(p,tries){const i=p.invoice||{},cur=i.currency||'CAD';box.innerHTML=`<div class="payment-pending-icon">…</div><h1>Payment submitted</h1><p>Stripe is still sending the verified payment confirmation to PLEASE. Please do not pay again.</p><div class="payment-result-details"><span>Invoice</span><strong>${esc(i.invoice_number||'Pending')}</strong><span>Amount</span><strong>${money(i.total_amount||0,cur)}</strong><span>Status</span><strong>${esc(i.payment_status||'PENDING')}</strong></div><p class="small-muted">This page checks automatically. You may also refresh the invoice in a moment.</p><div class="invoice-actions-row center">${i.public_token?`<a class="btn primary" href="invoice.html?token=${encodeURIComponent(i.public_token)}&payment=success">View invoice</a>`:''}<a class="btn secondary" href="index.html">Back to PLEASE</a></div>`}async function run(){let last=null;for(let i=0;i<10;i++){try{last=await get();if(last.payment_result?.paid||last.invoice?.payment_status==='PAID'){renderPaid(last);return}renderPending(last,i);await new Promise(r=>setTimeout(r,i<3?1500:2500));}catch(e){if(i<4){box.innerHTML=`<h1>Confirming payment…</h1><p>${esc(e.message)}</p><p class="small-muted">Please wait. Stripe may still be delivering the verified webhook.</p>`;await new Promise(r=>setTimeout(r,2000));continue}box.innerHTML=`<div class="invoice-result-banner danger"><strong>Payment confirmation unavailable</strong><span>${esc(e.message)}</span></div><p>Please open the invoice link again in a moment or contact PLEASE Services.</p><div class="invoice-actions-row center">${token?`<a class="btn primary" href="invoice.html?token=${encodeURIComponent(token)}&payment=success">Open invoice</a>`:''}<a class="btn secondary" href="index.html">Back to PLEASE</a></div>`;return}}if(last)renderPending(last,10)}run()})();
</script></body></html>
